<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    
    /* Legend & Slider Styling */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.67);
      padding: 15px 18px;
      font-family: sans-serif;
      font-size: 13px;
      border-radius: 6px;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 1;
      width: 290px;
    }
    /* Title formatting */
    #legend h4 {
      margin: 0 0 10px 0;
      font-size: 13px;
      font-weight: normal;
    }

    /* Stacking legend points*/
    .legend-scale {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Boxes (for legend) */
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }
    /* Point symbol styling for legend */
    .legend-point {
      width: 12px;
      height: 12px;
      background: rgba(60, 124, 226, 1);
      border: 1px solid #ffffff;
      border-radius: 50%;
    }
    .slider-container {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    input[type=range] {
      width: 100%;
      cursor: pointer;
    }

    /* MapLibre Popup Text Customization */
    .mapboxgl-popup-content, .maplibregl-popup-content {
      color: #333;
      font-family: sans-serif;
      font-size: 13px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="legend">
    <h4 id="legend-title">June Price / Accommodate ($)</h4>
    <div class="legend-scale">
      <div class="legend-item"><span class="legend-color" style="background: #a50f15;"></span> 142.50 – 170.00</div>
      <div class="legend-item"><span class="legend-color" style="background: #de2d26;"></span> 115.00 – 142.50</div>
      <div class="legend-item"><span class="legend-color" style="background: #fb6a4a;"></span> 87.50 – 115.00</div>
      <div class="legend-item"><span class="legend-color" style="background: #fcae91;"></span> 60.00 – 87.50</div>
      <div class="legend-item"><span class="legend-color" style="background: #fee5d9;"></span> &lt; 60.00</div>
      <!-- Tourist Attraction Legend Item -->
      <div class="legend-item" style="margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px;">
        <span class="legend-point"></span> Tourist Attractions
      </div>
    </div>
    
    <!-- Interactive Month Slider -->
    <div class="slider-container">
      <div class="slider-header">
        <span>Month:</span>
        <span id="month-label">June</span>
      </div>
      <input type="range" id="month-slider" min="0" max="1" step="1" value="0">
    </div>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: '472_Lab1_firstDraft.json', // Path to JSON file
      center: [-123.25, 49.26],          // Longitude, latitude at UBC
      zoom: 11,                          // Initial zoom level
      minZoom: 10                        // Prevents zooming out past level 10
    });

    map.addControl(new maplibregl.NavigationControl());

    // Define color scales for both months using the 60-170 range
    const juneColorScale = [
      "interpolate", ["linear"], ["get", "june_price_per_accommodate_mean"],
      60, "#fee5d9", 87.5, "#fcae91", 115, "#fb6a4a", 142.5, "#de2d26", 170, "#a50f15"
    ];

    const septColorScale = [
      "interpolate", ["linear"], ["get", "sept_price_per_accommodate_mean"],
      60, "#fee5d9", 87.5, "#fcae91", 115, "#fb6a4a", 142.5, "#de2d26", 170, "#a50f15"
    ];

    // Track active month for dynamic popups
    let currentMonthField = "june_price_per_accommodate_mean";
    let currentMonthName = "June";

    map.on('load', () => {
      const slider = document.getElementById('month-slider');
      const monthLabel = document.getElementById('month-label');
      const legendTitle = document.getElementById('legend-title');

      // Slider event listener
      slider.addEventListener('input', (e) => {
        if (e.target.value === '0') {
          currentMonthName = 'June';
          currentMonthField = 'june_price_per_accommodate_mean';
          monthLabel.innerText = 'June';
          legendTitle.innerText = 'June Price / Accommodate ($)';
          map.setPaintProperty('Airbnb-Polygons', 'fill-color', juneColorScale);
        } else {
          currentMonthName = 'September';
          currentMonthField = 'sept_price_per_accommodate_mean';
          monthLabel.innerText = 'September';
          legendTitle.innerText = 'September Price / Accommodate ($)';
          map.setPaintProperty('Airbnb-Polygons', 'fill-color', septColorScale);
        }
      });

      // --- SINGLE UNIFIED CLICK HANDLER FOR POPUPS ---
      map.on('click', (e) => {
        // Query rendered features from both layers at the clicked point
        const features = map.queryRenderedFeatures(e.point, {
          layers: ['TA Points', 'Airbnb-Polygons']
        });

        if (features.length === 0) return;

        // Take the topmost feature (TA Points renders on top of polygons)
        const topFeature = features[0];
        const layerId = topFeature.layer.id;

        if (layerId === 'TA Points') {
          const props = topFeature.properties;
          const attractionName = props["Tourist Attraction"] || "Tourist Attraction";

          new maplibregl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>Tourist Attraction</strong><br>${attractionName}`)
            .addTo(map);
        } else if (layerId === 'Airbnb-Polygons') {
          const props = topFeature.properties;
          const priceValue = props[currentMonthField];
          const formattedPrice = priceValue !== undefined ? Number(priceValue).toFixed(2) : "N/A";
          const neighbourhoodName = props.neighbourhood || "Neighbourhood";

          new maplibregl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>${neighbourhoodName}</strong><br>${currentMonthName} Price / Accommodate: $${formattedPrice}`)
            .addTo(map);
        }
      });

      // Change cursor to pointer when hovering over interactive layers
      const interactiveLayers = ['Airbnb-Polygons', 'TA Points'];
      interactiveLayers.forEach(layerId => {
        map.on('mouseenter', layerId, () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', layerId, () => {
          map.getCanvas().style.cursor = '';
        });
      });
    });
  </script>
</body>
</html>
