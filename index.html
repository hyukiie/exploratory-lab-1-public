<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    
    /* Legend & Toggle Switch Styling */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.67);
      padding: 15px 18px;
      font-family: sans-serif;
      font-size: 13px;
      border-radius: 6px;
      colour: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 1;
      width: 290px;
    }
    /* Title formatting */
    #legend h4 {
      margin: 0 0 10px 0;
      font-size: 13px;
      font-weight: normal;
    }

    /* Stacking legend points */
    .legend-scale {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Boxes (for legend) */
    .legend-colour {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }
    /* Point symbol styling for legend */
    .legend-point {
      width: 12px;
      height: 12px;
      background: rgba(60, 124, 226, 1);
      border: 1px solid #ffffff;
      border-radius: 50%;
    }

    /* Toggle Switch Container & Design */
    .switch-container {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch-label {
      font-weight: bold;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-switch {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-colour: rgba(0, 0, 0, 0.67);
      transition: .3s;
      border-radius: 24px;
    }
    .slider-switch:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-colour: black;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider-switch {
      background-colour: #de2d26;
    }
    input:checked + .slider-switch:before {
      transform: translateX(22px);
    }

    /* MapLibre Popup Text Customization */
    .mapboxgl-popup-content, .maplibregl-popup-content {
      colour: #333;
      font-family: sans-serif;
      font-size: 13px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="legend">
    <h4 id="legend-title">June Price / Accommodate ($)</h4>
    <div class="legend-scale">
      <div class="legend-item"><span class="legend-colour" style="background: #a50f15;"></span> 142.50 – 170.00</div>
      <div class="legend-item"><span class="legend-colour" style="background: #de2d26;"></span> 115.00 – 142.50</div>
      <div class="legend-item"><span class="legend-colour" style="background: #fb6a4a;"></span> 87.50 – 115.00</div>
      <div class="legend-item"><span class="legend-colour" style="background: #fcae91;"></span> 60.00 – 87.50</div>
      <div class="legend-item"><span class="legend-colour" style="background: #fee5d9;"></span> &lt; 60.00</div>
      <!-- Tourist Attraction Legend Item -->
      <div class="legend-item" style="margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px;">
        <span class="legend-point"></span> Tourist Attractions
      </div>
    </div>
    
    <!-- Interactive Month Toggle Switch -->
    <div class="switch-container">
      <span class="switch-label" id="month-label">June</span>
      <label class="switch">
        <input type="checkbox" id="month-toggle">
        <span class="slider-switch"></span>
      </label>
    </div>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: '472_Lab1_firstDraft.json', // Path to JSON file
      center: [-123.25, 49.26],          // Longitude, latitude at UBC
      zoom: 11,                          // Initial zoom level
      minZoom: 10                        // Prevents zooming out past level 10
    });

    map.addControl(new maplibregl.NavigationControl());

    // Define colour scales for both months using the 60-170 range
    const juneColourScale = [
      "interpolate", ["linear"], ["get", "june_price_per_accommodate_mean"],
      60, "#fee5d9", 87.5, "#fcae91", 115, "#fb6a4a", 142.5, "#de2d26", 170, "#a50f15"
    ];

    const septColourScale = [
      "interpolate", ["linear"], ["get", "sept_price_per_accommodate_mean"],
      60, "#fee5d9", 87.5, "#fcae91", 115, "#fb6a4a", 142.5, "#de2d26", 170, "#a50f15"
    ];

    map.on('load', () => {
      const toggle = document.getElementById('month-toggle');
      const monthLabel = document.getElementById('month-label');
      const legendTitle = document.getElementById('legend-title');

      // Switch event listener
      toggle.addEventListener('change', (e) => {
        if (!e.target.checked) {
          monthLabel.innerText = 'June';
          legendTitle.innerText = 'June Price / Accommodate ($)';
          map.setPaintProperty('Airbnb-Polygons', 'fill-colour', juneColourScale);
        } else {
          monthLabel.innerText = 'September';
          legendTitle.innerText = 'September Price / Accommodate ($)';
          map.setPaintProperty('Airbnb-Polygons', 'fill-colour', septColourScale);
        }
      });

      // --- POPUP FUNCTIONALITY ---

      // Click interaction only for Tourist Attraction Points using "Tourist Attraction" field
      map.on('click', 'TA Points', (e) => {
        const props = e.features[0].properties;
        const attractionName = props["Tourist Attraction"] || "Tourist Attraction";

        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<strong>Tourist Attraction</strong><br>${attractionName}`)
          .addTo(map);
      });

      // Change cursor to pointer when hovering over tourist attraction points
      map.on('mouseenter', 'TA Points', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'TA Points', () => {
        map.getCanvas().style.cursor = '';
      });
    });
  </script>
</body>
</html>
